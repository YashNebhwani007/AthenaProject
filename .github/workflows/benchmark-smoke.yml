name: Athena Benchmark Smoke Test

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset for benchmark smoke test"
        required: false
        default: "telco_churn"

jobs:
  benchmark-smoke:
    name: Run Benchmark Smoke Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run benchmark smoke evaluation
        env:
          ATHENA_LLM_CACHE_MODE: replay
        run: |
          python -m benchmark.datasets.download
          python -m benchmark.runner --systems A1,B1 --repeats 1 --questions smoke
          cat benchmark/results/results.md
