[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "athena"
version = "0.4.0"
description = "Athena — Autonomous Data Science & Decision Intelligence Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "duckdb>=1.1,<2",
    "pandas>=2.2,<4",
    "scipy>=1.13,<2",
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.4,<5",
    "shap>=0.45,<1",
    "matplotlib>=3.8,<4",
    "plotly>=5.22,<6",
    "kaleido>=0.2,<1",
    "sqlglot>=25,<26",
    "httpx>=0.27,<1",
    "structlog>=24.1,<25",
    "mcp>=1,<3",
    "sse-starlette>=2,<4",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "ruff>=0.5,<1",
    "pyright>=1.1.370",
]

[project.scripts]
athena = "athena.cli:main"
athena-mcp = "athena.mcp_server.server:main"
athena-verify = "scripts.verify_datasets:main"
athena-docs = "scripts.validate_docs:main"

[tool.hatch.build.targets.wheel]
packages = ["src/athena"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
