services:
  - type: web
    name: athena-agent
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: "openrouter"
      - key: LLM_MODEL
        value: "anthropic/claude-3.5-sonnet"
      - key: ATHENA_DATA_DIR
        value: "/tmp/athena_data"
    healthCheckPath: /health
