services:
  - type: web
    name: athena-agent
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ATHENA_LLM_PROVIDER
        value: gemini
      - key: ATHENA_LLM_MODEL
        value: gemini-flash-lite-latest
      - key: ATHENA_LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: ATHENA_LLM_CACHE_MODE
        value: "off"
      - key: ATHENA_DATA_DIR
        value: /tmp/athena_data
      - key: ATHENA_LLM_API_KEY
        sync: false
